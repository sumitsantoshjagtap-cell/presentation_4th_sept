function updateChrome(){
  stack.forEach(function(s,i){s.el.inert=(i!==stack.length-1)});
  homeEl.inert=stack.length>0;
  var tab=stack.length?aisleOf(stack[0].id):'home';
  $$('button',dock).forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===tab)});
}
function lock(ms){busy=true;setTimeout(function(){busy=false},ms)}
function openNode(id,fromEl,opts){
  opts=opts||{};
  var el=buildScreen(id);
  el.style.zIndex=20+stack.length;
  var below=stack.length?stack[stack.length-1].el:homeEl;
  stage.appendChild(el);stack.push({id:id,el:el});
  initScreen(el);updateChrome();
  var bk=$('.back',el);
  if(opts.instant||RM){if(bk&&!opts.instant)bk.focus({preventScroll:true});return}
  var vw=innerWidth,vh=innerHeight;
  var r=fromEl&&fromEl.getBoundingClientRect?fromEl.getBoundingClientRect():null;
  if(!r||r.width===0||r.bottom<0||r.top>vh)r={left:vw/2-90,right:vw/2+90,top:vh/2-90,bottom:vh/2+90};
  var from='inset('+Math.max(0,r.top)+'px '+Math.max(0,vw-r.right)+'px '+Math.max(0,vh-r.bottom)+'px '+Math.max(0,r.left)+'px round 22px)';
  var bgTo=getComputedStyle(el).backgroundColor;
  var bgFrom=fromEl&&fromEl.nodeType===1?getComputedStyle(fromEl).backgroundColor:bgTo;
  lock(560);
  el.animate({clipPath:[from,'inset(0px 0px 0px 0px round 0px)'],backgroundColor:[bgFrom,bgTo]},{duration:dur(540),easing:EASE,fill:'backwards'});
  $('.s-scroll',el).animate({opacity:[0,1],transform:['scale(.96)','scale(1)']},{duration:dur(380),delay:dur(160),easing:EASE,fill:'backwards'});
  below.animate({transform:['scale(1)','scale(1.05)'],opacity:[1,.25]},{duration:dur(540),easing:EASE,fill:'forwards'});
  if(bk)setTimeout(function(){try{bk.focus({preventScroll:true})}catch(e){}},560);
}
function closeTop(opts){
  opts=opts||{};
  if(!stack.length)return;
  var top=stack.pop(),el=top.el;
  var below=stack.length?stack[stack.length-1].el:homeEl;
  updateChrome();
  below.getAnimations().forEach(function(a){a.cancel()});
  if(RM||opts.instant){el.remove();return}
  var tile=opts.fade?null:below.querySelector('[data-id="'+top.id+'"]');
  var r=null;
  if(tile){
    r=tile.getBoundingClientRect();
    if(r.bottom<0||r.top>innerHeight){tile.scrollIntoView({block:'center'});r=tile.getBoundingClientRect()}
  }
  lock(460);
  var bgFrom=getComputedStyle(el).backgroundColor;
  var sc=$('.s-scroll',el);
  sc.animate({opacity:[1,0]},{duration:dur(200),easing:'ease-in',fill:'forwards'});
  var done=function(){el.remove();if(tile){try{tile.focus({preventScroll:true})}catch(e){}}};
  var a;
  if(r){
    var vw=innerWidth,vh=innerHeight;
    var to='inset('+Math.max(0,r.top)+'px '+Math.max(0,vw-r.right)+'px '+Math.max(0,vh-r.bottom)+'px '+Math.max(0,r.left)+'px round 22px)';
    a=el.animate({clipPath:['inset(0px 0px 0px 0px round 0px)',to],backgroundColor:[bgFrom,getComputedStyle(tile).backgroundColor]},{duration:dur(440),easing:EASE,fill:'forwards'});
  }else{
    a=el.animate({opacity:[1,0]},{duration:dur(260),easing:'ease-in',fill:'forwards'});
  }
  below.animate({transform:['scale(1.05)','scale(1)'],opacity:[.25,1]},{duration:dur(440),easing:EASE});
  a.onfinish=done;
}
function closeTo(d){
  if(busy)return;
  while(stack.length>d+1){stack.splice(stack.length-2,1)[0].el.remove()}
  updateChrome();
  if(stack.length>d)closeTop();
}
function closeAll(){
  while(stack.length>1)stack.splice(0,1)[0].el.remove();
  homeEl.getAnimations().forEach(function(a){a.cancel()});
  if(stack.length)closeTop({fade:true});
}
function swap(dir){
  if(!stack.length||busy)return;
  var top=stack[stack.length-1],sibs=siblings(top.id),i=sibs.indexOf(top.id)+dir;
  if(i<0||i>=sibs.length)return;
  var nid=sibs[i],el=buildScreen(nid),old=top.el;
  el.style.zIndex=old.style.zIndex;
  stage.appendChild(el);top.id=nid;top.el=el;initScreen(el);updateChrome();
  if(RM){old.remove();return}
  lock(400);
  var w=innerWidth*0.1*dir;
  el.animate({transform:['translateX('+w+'px)','none'],opacity:[0,1]},{duration:380,easing:EASE,fill:'backwards'});
  var a=old.animate({transform:['none','translateX('+(-w)+'px)'],opacity:[1,0]},{duration:300,easing:EASE,fill:'forwards'});
  a.onfinish=function(){old.remove()};
  var bk=$('.back',el);if(bk)bk.focus({preventScroll:true});
}
function openPath(id,fromEl){
  var path=pathOf(id),k=0;
  while(k<stack.length&&k<path.length&&stack[k].id===path[k])k++;
  while(stack.length>k){stack.pop().el.remove()}
  var top=stack.length?stack[stack.length-1].el:homeEl;
  top.getAnimations().forEach(function(a){a.cancel()});
  if(k===path.length){updateChrome();return}
  for(var i=k;i<path.length;i++)openNode(path[i],i===path.length-1?fromEl:null,{instant:i<path.length-1});
}

var INDEX=[];
function collect(o,out){
  if(typeof o==='string'){out.push(o);return}
  if(Array.isArray(o)){o.forEach(function(x){collect(x,out)});return}
  if(o&&typeof o==='object'){Object.keys(o).forEach(function(k){if(k!=='t'&&k!=='k'&&k!=='to'&&k!=='tone'&&k!=='n'&&k!=='ol')collect(o[k],out)})}
}
Object.keys(D.nodes).forEach(function(id){
  var n=D.nodes[id],parts=[n.lead||'',n.tag||''];collect(n.blocks,parts);
  var text=parts.join(' ').replace(/\*\*/g,'');
  INDEX.push({id:id,title:n.title,blurb:n.blurb||'',text:text,low:(n.title+' '+(n.blurb||'')+' '+text).toLowerCase(),depth:pathOf(id).length});
});

  var q=qEl.value.trim().toLowerCase();
  if(!q){resEl.hidden=true;resEl.innerHTML='';return}
  var terms=q.split(/\s+/);
  var hits=INDEX.filter(function(e){return terms.every(function(t){return e.low.indexOf(t)>-1})}).map(function(e){
    var s=0,t=e.title.toLowerCase();terms.forEach(function(w){if(t.indexOf(w)>-1)s+=10;if(e.blurb.toLowerCase().indexOf(w)>-1)s+=4;s+=Math.min(5,e.low.split(w).length-1)});
    return {e:e,s:s-e.depth*0.5}}).sort(function(a,b){return b.s-a.s}).slice(0,8);
  if(!hits.length){resEl.innerHTML='<div class="res-none">Nothing found for “'+esc(qEl.value)+'”.</div>';resEl.hidden=false;return}
  resEl.innerHTML=hits.map(function(h){
    var e=h.e,i=e.text.toLowerCase().indexOf(terms[0]),snip='';
    if(i>-1){var a=Math.max(0,i-40);snip=(a>0?'…':'')+e.text.slice(a,i+90).trim()+'…'}else snip=e.blurb;
    return '<button type="button" class="res" data-go="'+e.id+'"><span class="res-t">'+esc(e.title)+'</span><span class="res-p">'+esc(pathLabel(e.id))+'</span><span class="res-s">'+esc(snip)+'</span></button>';
  }).join('');
  resEl.hidden=false;

  if(e.key==='/'&&!typing&&!e.metaKey&&!e.ctrlKey){e.preventDefault();focusSearch();return}
  if(typing)return;
  if(e.key==='Escape'||e.key==='Backspace'){if(stack.length&&!busy){e.preventDefault();closeTop()}return}
  if(e.key==='ArrowRight'){if(stack.length){e.preventDefault();swap(1)}return}
  if(e.key==='ArrowLeft'){if(stack.length){e.preventDefault();swap(-1)}return}
});
updateChrome();
})();
</script>
