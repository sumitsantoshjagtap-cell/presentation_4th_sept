<meta charset="utf-8">
<title>Smart Basket, red edition</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('sb-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){try{t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}catch(e){t='light'}}
document.documentElement.setAttribute('data-theme',t)})();
</script>
<style>
/* Layout concept: a grocery-app home (aisles of colourful product tiles). Tapping a tile zooms the tile into a full screen; screens nest as deep as the content goes. */
:root{
  --bg:#FFF8F4; --surface:#FFFFFF; --ink:#2B1410; --muted:#7A5148; --line:#F4D9CE; --leaf:#D62F26; --leaf-2:#A8201A; --on-leaf:#FFFFFF; --butter:#FF9A2E; --on-butter:#2B1400; --tomato:#B3261E; --t0:#FFE0D9; --t1:#FFEBCB; --t2:#FFD9BE; --t3:#FFF0E8; --t4:#FCDDE3; --t5:#FFF4D9; --chip:rgba(255,255,255,.7); --chip-ink:#2B1410;
  --shadow:0 1px 2px rgba(17,36,24,.06),0 14px 30px -18px rgba(17,36,24,.35);
  --font-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D0F0C; --surface:#2B1713; --ink:#FBEDE7; --muted:#D2A99D; --line:#4A2A22; --leaf:#FF6B5E; --leaf-2:#E8493C; --on-leaf:#2B0805; --butter:#FFA94D; --on-butter:#2B1400; --tomato:#FF8E7F; --t0:#4A1F1A; --t1:#4A3414; --t2:#4F2814; --t3:#3A2019; --t4:#46202B; --t5:#463818; --chip:rgba(0,0,0,.32); --chip-ink:#FBEDE7;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D0F0C; --surface:#2B1713; --ink:#FBEDE7; --muted:#D2A99D; --line:#4A2A22; --leaf:#FF6B5E; --leaf-2:#E8493C; --on-leaf:#2B0805; --butter:#FFA94D; --on-butter:#2B1400; --tomato:#FF8E7F; --t0:#4A1F1A; --t1:#4A3414; --t2:#4F2814; --t3:#3A2019; --t4:#46202B; --t5:#463818; --chip:rgba(0,0,0,.32); --chip-ink:#FBEDE7;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -18px rgba(0,0,0,.7); color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--leaf);outline-offset:3px;border-radius:10px}
b{font-weight:700}
.wrap{width:100%;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- home ---------- */
#home{min-height:100vh;padding-bottom:140px;transform-origin:50% 30%}
.appbar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 22px/1 var(--font-display);letter-spacing:-.02em;white-space:nowrap}
.mark{width:34px;height:34px;border-radius:11px;background:var(--leaf);position:relative;flex:none}
.mark::before{content:"";position:absolute;left:7px;right:7px;bottom:8px;height:12px;border-radius:3px 3px 8px 8px;background:var(--on-leaf)}
.mark::after{content:"";position:absolute;left:11px;top:7px;width:12px;height:11px;border:3px solid var(--butter);border-bottom:0;border-radius:8px 8px 0 0}
.search{position:relative;flex:1;max-width:640px;margin-left:auto}
.search input{width:100%;height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:0 18px 0 46px;font:500 16px var(--font-body)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:16px;top:13px;width:20px;height:20px;color:var(--muted)}
.res-box{position:absolute;left:0;right:0;top:54px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:6px;z-index:80;max-height:min(70vh,520px);overflow:auto}
.res{display:block;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:10px 12px}
.res:hover,.res:focus-visible{background:var(--bg)}
.res-t{display:block;font:700 16px var(--font-display)}
.res-p{display:block;font-size:12.5px;color:var(--leaf);font-weight:600}
.res-s{display:block;font-size:13.5px;color:var(--muted)}
.res-none{padding:14px;color:var(--muted)}
.keys{font-size:12.5px;color:var(--muted);white-space:nowrap}
.keys kbd{font:600 11.5px var(--font-body);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--surface)}

.hero{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.hero-main{background:var(--leaf);color:var(--on-leaf);border-radius:30px;padding:clamp(22px,3.4vw,44px);position:relative;overflow:hidden;min-width:0}
.hero-main::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:var(--butter);opacity:.95}.hero-main{background:linear-gradient(135deg,var(--leaf),#F2552C)}
.hero-main>*{position:relative;z-index:1}
.eyebrow{font:700 12.5px var(--font-body);letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero h1{font:800 clamp(38px,6vw,76px)/.96 var(--font-display);letter-spacing:-.035em;margin:10px 0 14px;max-width:11ch;text-wrap:balance}
.hero-main p{font-size:clamp(16px,1.6vw,20px);max-width:44ch;margin:0;opacity:.95}
.hero-main{display:flex;flex-direction:column}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:26px}
.stats span{background:rgba(255,255,255,.18);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px}
.before-after{background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:22px;box-shadow:var(--shadow);min-width:0}
.ba-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.ba-head h2{font:700 18px var(--font-display);margin:0}
.seg{display:inline-flex;background:var(--bg);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf)}
.ba-rows{display:grid;gap:10px}
.ba-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:12px;border-radius:16px;background:var(--bg)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:800 16px var(--font-display);background:var(--tint,var(--t0));color:var(--ink);flex:none}
.ba-row b{display:block;font-size:14.5px}
.ba-row span.txt{font-size:14.5px;color:var(--muted);display:block}
.ba-row.pop span.txt{animation:fadeup .35s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ba-foot{margin:12px 2px 0;font-size:12.5px;color:var(--muted)}

.chips{display:flex;gap:10px;overflow-x:auto;padding:18px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px}
.chip:hover{border-color:var(--leaf);color:var(--leaf)}

.aisle{margin-top:34px;scroll-margin-top:84px}
.aisle-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.aisle-head h2{font:800 clamp(24px,3vw,34px)/1 var(--font-display);letter-spacing:-.02em;margin:0}
.aisle-head p{margin:0;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,218px),1fr));gap:14px}
.tile{position:relative;text-align:left;border:0;border-radius:22px;background:var(--tint,var(--t0));color:var(--ink);padding:16px 16px 56px;min-height:190px;display:flex;flex-direction:column;gap:6px;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s;min-width:0}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.tile:active{transform:scale(.98)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}
.code{font:800 46px/1 var(--font-display);letter-spacing:-.04em}
.code.long{font-size:28px;line-height:1.25;letter-spacing:-.02em}
.tag{background:var(--chip);color:var(--chip-ink);font-weight:700;font-size:11.5px;border-radius:999px;padding:4px 9px;text-align:right;max-width:60%}
.tile-title{font:700 19px/1.2 var(--font-display);letter-spacing:-.01em;text-wrap:balance}
.tile-blurb{font-size:14px;line-height:1.35;opacity:.78}
.plus{position:absolute;right:12px;bottom:12px;width:36px;height:36px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;transition:transform .25s}
.plus svg{width:18px;height:18px}
.tile:hover .plus{transform:rotate(90deg) scale(1.08)}

/* ---------- screens ---------- */
#stage{position:relative}
.screen{position:fixed;inset:0;overflow-y:auto;background:var(--bg);overscroll-behavior:contain}
.s-scroll{min-height:100%;padding-bottom:150px}
.s-bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.s-bar-in{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--leaf);color:var(--on-leaf);border:0;border-radius:999px;padding:9px 16px 9px 12px;font-weight:700;font-size:15px;flex:none}
.back svg,.ico svg{width:18px;height:18px}
.crumbs{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;font-size:14px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:4px 6px;border-radius:8px;color:var(--muted);font-weight:600;max-width:22ch;overflow:hidden;text-overflow:ellipsis}
.crumbs button:hover{color:var(--leaf);background:var(--surface)}
.crumbs .cur{font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.crumbs .sep{opacity:.5}
.pager{display:flex;align-items:center;gap:6px;flex:none;color:var(--muted);font-size:13px;font-weight:600}
.ico{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.ico:disabled{opacity:.35;cursor:default}
.ico:not(:disabled):hover{border-color:var(--leaf);color:var(--leaf)}
.s-hero{background:var(--tint);padding-top:clamp(20px,4vw,40px);padding-bottom:clamp(22px,4vw,42px)}
.s-hero .wrap{display:flex;gap:clamp(16px,3vw,36px);align-items:flex-start}
.s-code{font:800 clamp(54px,9vw,120px)/.85 var(--font-display);letter-spacing:-.05em;flex:none;min-width:.8em}
.s-code.long{font-size:clamp(30px,5vw,56px);line-height:1;letter-spacing:-.03em;padding-top:6px}
.s-hero h2{font:800 clamp(30px,4.6vw,58px)/1 var(--font-display);letter-spacing:-.03em;margin:0 0 10px;text-wrap:balance}
.s-tag{display:inline-block;background:var(--chip);color:var(--chip-ink);font-weight:700;font-size:12.5px;border-radius:999px;padding:4px 12px;margin-bottom:12px}
.lead{font-size:clamp(17px,1.9vw,21px);line-height:1.45;max-width:68ch;margin:0}
.s-body{padding-top:26px;display:flex;flex-direction:column;gap:20px}
.kids-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:-6px}
.kids-head span:first-child{font:800 13px var(--font-body);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf)}
.kids-head .hint{font-size:13px;color:var(--muted)}

/* ---------- content blocks ---------- */
.para{margin:0;max-width:78ch;font-size:17px}
.sub{font:800 22px/1.15 var(--font-display);letter-spacing:-.015em;margin:12px 0 -6px}
.list{margin:0;padding-left:1.2em;display:grid;gap:6px;max-width:80ch;font-size:16.5px}
.list li::marker{color:var(--leaf)}
.co{border-radius:20px;padding:16px 18px;background:var(--t1);max-width:92ch}
.co p{margin:6px 0 0;font-size:16.5px}
.co-l{display:inline-block;font:800 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;background:var(--chip);color:var(--chip-ink);border-radius:999px;padding:3px 10px}
.co-warn{background:var(--t2)}.co-good{background:var(--t0)}.co-note{background:var(--t1)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15.5px;min-width:560px}
th{font:700 12.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 14px;background:var(--bg);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-weight:700}
.stars{color:#E0A100;letter-spacing:2px;font-size:17px;white-space:nowrap}
.stars i{font-style:normal;color:var(--line)}
.stars small{color:var(--muted);letter-spacing:0;font-size:12.5px;margin-left:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;min-width:0}
.card h4{font:800 17px/1.2 var(--font-display);margin:0 0 8px}
.card p{margin:0;font-size:15.5px}
.card ul,.card ol{margin:6px 0 0;padding-left:1.2em;display:grid;gap:7px;font-size:15.5px}
.card li::marker{color:var(--leaf);font-weight:700}
.kv{margin:0;display:grid;gap:10px}
.kv-row{display:grid;grid-template-columns:200px minmax(0,1fr);gap:6px 16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;align-items:start}
.kv dt{align-self:start;justify-self:start;font:800 12px var(--font-body);letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:5px 12px;background:var(--bg);color:var(--ink)}
.kv dt.k-problem{background:var(--t2)}.kv dt.k-fix{background:var(--t0)}.kv dt.k-fall{background:var(--t1)}.kv dt.k-ml{background:var(--t3)}.kv-row{grid-template-columns:130px minmax(0,1fr)}
.kv dd{margin:0;font-size:16.5px}
.card .kv-mini{margin-top:10px;display:grid;gap:8px}
.card .kv-mini div{font-size:15px}
.card .kv-mini b{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px;max-width:92ch}
.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px;font-size:16.5px}
.steps li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--leaf);color:var(--on-leaf);display:grid;place-items:center;font:800 15px var(--font-display)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.flow-n{background:var(--t3);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px}
.flow-a{color:var(--leaf);font-weight:800}
.fig{margin:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:12px;color:#1c2b22}
.fig img{display:block;width:100%;height:auto;border-radius:10px}
.fig figcaption{font-size:13.5px;color:#4c5f54;padding:8px 4px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.fig-d,.img-d{display:none}
.fig-arch{background:#fff}
.fig-scroll{overflow:auto;border-radius:10px}
.fig.full .fig-scroll img{width:1379px;max-width:none}
.btn-sm{border:1.5px solid #c9d7c8;background:#fff;color:#1c2b22;border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fig-arch{background:#0f1a22;border-color:var(--line)}
:root:not([data-theme="light"]) .fig-arch figcaption{color:#9db4a2}:root:not([data-theme="light"]) .fig-arch .btn-sm{background:#14241A;color:#E9F3E9;border-color:var(--line)}
:root:not([data-theme="light"]) .img-l.arch{display:none}:root:not([data-theme="light"]) .img-d.arch{display:block}}
:root[data-theme="dark"] .fig-arch{background:#0f1a22;border-color:var(--line)}
:root[data-theme="dark"] .fig-arch figcaption{color:#9db4a2}:root[data-theme="dark"] .fig-arch .btn-sm{background:#14241A;color:#E9F3E9;border-color:var(--line)}
:root[data-theme="dark"] .img-l.arch{display:none}:root[data-theme="dark"] .img-d.arch{display:block}
.golink{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;border:1.5px solid var(--leaf);color:var(--leaf);background:none;border-radius:999px;padding:9px 16px;font-weight:700}
.golink:hover{background:var(--leaf);color:var(--on-leaf)}
.impact{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.imp{border-radius:20px;padding:14px 16px;min-width:0}
.imp h4{font:800 12px var(--font-body);letter-spacing:.1em;text-transform:uppercase;margin:0 0 8px}
.imp p{margin:0;font-size:15.5px}
.imp.i0{background:var(--t2)}.imp.i1{background:var(--t3)}.imp.i2{background:var(--t4)}.imp.i3{background:var(--t0)}
details.q{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:0}
details.q summary{cursor:pointer;padding:14px 18px;font:700 17px var(--font-display);list-style:none;display:flex;gap:12px;justify-content:space-between;align-items:center}
details.q summary::-webkit-details-marker{display:none}
details.q summary::after{content:"+";font-size:22px;color:var(--leaf);transition:transform .2s;flex:none}
details.q[open] summary::after{transform:rotate(45deg)}
details.q .qa-b{padding:0 18px 16px;display:grid;gap:8px;font-size:16px}
details.q .qa-b p{margin:0}
.assump{color:var(--muted)}
.assump b{color:var(--ink)}

/* ---------- demos ---------- */
.demo{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;display:grid;gap:14px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.pcard{background:var(--bg);border-radius:16px;padding:12px 14px;animation:fadeup .3s ease both}
.pcard h4{margin:0 0 4px;font:800 13px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--leaf)}
.pcard p{margin:0;font-size:15.5px}
.bar{display:flex;gap:10px;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px}
.bar .q{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;background:var(--leaf);color:var(--on-leaf);border-radius:999px;padding:9px 18px;font-weight:700}
.btn:disabled{opacity:.5;cursor:default}
.layers{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.layers li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;border:1.5px dashed var(--line);border-radius:16px;padding:10px 14px 10px 10px;opacity:.35;transition:opacity .4s,border-color .4s,background .4s}
.layers li.on{opacity:1;border-style:solid;border-color:var(--leaf);background:var(--t0)}
.layers .n{width:30px;height:30px;border-radius:50%;background:var(--surface);border:1.5px solid var(--leaf);color:var(--leaf);display:grid;place-items:center;font:800 14px var(--font-display)}
.layers b{display:block}
.layers span.tx{font-size:15.5px}
.verdict{border-radius:18px;background:var(--leaf);color:var(--on-leaf);padding:14px 18px}
.verdict p{margin:0}
.rca{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.rca .col{border:1.5px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:8px;align-content:start;transition:opacity .3s,border-color .3s}
.rca .col.dim{opacity:.35}
.rca .col.sel{border-color:var(--leaf)}
.rca .col h4{margin:0;font:800 13px var(--font-body);letter-spacing:.1em;text-transform:uppercase}

p history, where a test shows lift over B."], ["Relative cost", "High"], ["Training", "Offline, deeper models."], ["Release", "Canary release, automatic rollback."]]}, {"t": "tb", "h": ["Feature", "Pipeline C \u2013 Full"], "r": [["Home screen", "Pipeline B \u2013 Balanced plus two-tower retrieval and sequence models (SASRec, GRU4Rec) \u2192 LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Category filters", "The customer\u2019s own categories, popular ones as filler \u2192 Same as Pipeline B \u2013 Balanced (no deeper variant defined)"], ["Offers and Deals", "Live offers at this dark store \u2192 Same as Pipeline B \u2013 Balanced (no deeper variant defined)"], ["Search pop-up", "Prefix matching \u2192 LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Buy it again", "The customer\u2019s own past purchases \u2192 Pipeline B \u2013 Balanced plus deep ranking (an interval or survival model is an option)"], ["Substitution", "Attribute-based candidate filtering \u2192 LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Add to cart", "Pipeline B \u2013 Balanced plus sequence models for session intent \u2192 Ordered by co-occurrence strength (lift or cosine)"], ["Recipe ideas", "Same as Pipeline B \u2013 Balanced (no deeper variant defined) \u2192 Same as Pipeline B \u2013 Balanced (no deeper variant defined)"], ["Just before payment", "Co-occurrence on the whole cart, plus items that are due \u2192 Cart-aware LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Cold start (New and Guest)", "Dark-store popularity (sign-up preferences for New, session clicks for Guest) \u2192 Time-of-day rules"]]}], "kids": [], "kidsLabel": "", "after": false, "tint": 5, "art": "jam"}, "n8": {"id": "n8", "title": "Three pipelines", "blurb": "Three ways to run Phase 1", "tag": "Recommended: B", "code": "6", "lead": "All three share the same routing, rules and safety. Only the relevance machinery and the release control grow.", "blocks": [{"t": "demo", "n": "pick", "h": "Which pipeline fits?", "o": [["Thin history, no live experiments", "<b>Pipeline A \u2013 Core.</b> The smallest safe pipeline. Grow only when a test shows a need."], ["Moderate history, a small live test", "<b>Pipeline B \u2013 Balanced.</b> One trained ranker; the best balance of relevance and cost."], ["Deep history, lift proven over B", "<b>Pipeline C \u2013 Full.</b> Only if the deep layers beat B by more than their running cost."]]}, {"t": "tb", "h": ["", "Pipeline A \u2013 Core", "Pipeline B \u2013 Balanced", "Pipeline C \u2013 Full"], "r": [["Idea", "Rules and scores, no training", "A trained LightGBM ranker, plus uplift and MLM", "B plus deep models"], ["Suits", "Thin history, fast launch", "Most clients", "High traffic, deep history"], ["Relative cost", "Low", "Medium", "High"], ["Training", "None", "Offline, on client data", "Offline, deeper models"], ["Release", "Manual staged release", "Canary release, manual rollback", "Canary release, automatic rollback"]]}, {"t": "co", "l": "Honest note", "x": "MLM (Recipe ideas) is the only neural model in Pipeline B \u2013 Balanced, trained offline on the recipe catalogue. Pipeline A \u2013 Core uses catalogue matching only. Uplift modeling needs logged offers and a holdback group.", "tone": "warn"}, {"t": "co", "l": "Relative costs", "x": "Judgments, not measurements. Figures are agreed with the client.", "tone": "note"}], "kids": ["tA", "tB", "tC"], "kidsLabel": "", "after": false, "tint": 1, "art": "cheese"}, "n9": {"id": "n9", "title": "Business constraints", "blurb": "Can it be sold and delivered?", "tag": "5 rules", "code": "9", "lead": "Can it be sold and delivered? Real-world rules beat relevance.", "blocks": [{"t": "flow", "x": ["Before ranking: Stage 1 Eligibility mask", "After ranking: Stage 3 Re-rank and Stage 4 Final gate", "Add to cart", "Checkout"]}, {"t": "cards", "x": [{"h": "Hard rules", "p": "Never broken: expiry, declared diet and allergy, stock, delivery, and price correctness. In plain words: a hard rule is one the system will not bend, whatever the model thinks."}, {"h": "Soft rules", "p": "Preferences that can be relaxed in a set order: price fit, capped margin, variety and inferred taste."}]}, {"t": "h", "x": "Where the rules act, stage by stage"}, {"t": "tb", "h": ["Where", "What happens"], "r": [["Stage 1 \u2013 Eligibility mask", "Removes anything that fails the five rules: inventory, delivery, expiry, diet and allergy, price and margin. Prepared per store, before ranking."], ["Stage 3 \u2013 Re-rank", "Applies soft rules only: variety, removing items already in the cart, a promotion cap, and a capped margin weight in Pipeline B \u2013 Balanced and Pipeline C \u2013 Full."], ["Stage 4 \u2013 Final gate", "Re-checks stock, price, promotion validity and slot live on the top items. Anything it cannot verify is removed."], ["Add to cart", "Stock and price are checked again before the item enters the cart."], ["Checkout", "The last authority: the order is confirmed against live data."]]}, {"t": "co", "l": "One rule function", "x": "The rules are written once and used in both the Eligibility mask and the Final gate, so the two cannot disagree. They are the same in Pipeline A \u2013 Core, Pipeline B \u2013 Balanced and Pipeline C \u2013 Full; the margin cap starts in Pipeline B \u2013 Balanced.", "tone": "good"}, {"t": "co", "l": "If rules conflict", "x": "Safety first, then availability, then price and margin.", "tone": "warn"}, {"t": "co", "l": "Always", "x": "Missing or old data means the item is not eligible.", "tone": "warn"}, {"t": "co", "l": "Client decisions", "x": "The stock buffer, the freshness limit and where margin sits are agreed with the client. No figures are assumed here.", "tone": "good"}], "kids": ["n9.1", "n9.2", "n9.3", "n9.4", "n9.5"], "kidsLabel": "", "after": false, "tint": 2, "art": "cheese"}, "n10": {"id": "n10", "title": "Guardrails", "blurb": "Safety rules that hold", "tag": "5 guardrails", "code": "10", "lead": "Safety rules that hold, even if someone asks.", "blocks": [{"t": "h", "x": "Try it: \u201cdelete transactions with bread\u201d"}, {"t": "p", "x": "A customer taps bread. The service fetches data, runs the pipeline and returns bread-related items. Then someone, or some component, sends the instruction \u201cdelete transactions with bread\u201d. Press Send to see which guardrails hold."}, {"t": "demo", "n": "bread", "layers": [{"n": "Input checking", "x": "The text is treated as search text, not as a command."}, {"n": "Allowed-actions list", "x": "The service has no delete operation, so there is nothing to run."}, {"n": "Read-only access", "x": "Even if a delete were attempted, the database refuses it."}, {"n": "Human approval", "x": "A real cleanup, such as removing duplicates, needs a named person who sees the exact record IDs and the count, not \u201call bread transactions\u201d."}, {"n": "Final output gate", "x": "The customer still receives a normal, safe list of bread recommendations."}], "why": "\u201cBread\u201d matches thousands of records, so a literal reading would wipe out far more than anyone intended, and deleted sales history may be impossible to recover.", "rule": "Completed transactions are append-only. Cleanup targets specific record IDs, never a word or a pattern.", "result": "The customer sees their bread recommendations as usual, and nothing is deleted."}, {"t": "h", "x": "More examples to try"}, {"t": "p", "x": "Pick a situation and press Send. Each step shows whether that guardrail holds the line or is simply not involved in this case. Not every guardrail is needed every time, but the Final output gate always runs."}, {"t": "demo", "n": "guard", "ex": [{"n": "Export request", "q": "export all customers", "sit": "Someone types \u201cexport all customers\u201d into the search bar, or sends it as a request to the service.", "layers": [{"n": "Input checking", "x": "The words are searched like any other text. They are not run as an instruction.", "st": "h"}, {"n": "Allowed-actions list", "x": "Export is not on the short list of fetch, score, rank and log, so it is rejected, not interpreted.", "st": "h"}, {"n": "Read-only access", "x": "Not involved: this asks to read data out, not to change it. The Allowed-actions list is what stops it.", "st": "i"}, {"n": "Human approval", "x": "Not involved: nothing asks to change data.", "st": "i"}, {"n": "Final output gate", "x": "The customer still receives a normal, safe list.", "st": "h"}], "rule": "The service does only what is on its list. Everything else is turned away.", "result": "No customer data leaves, and the search shows nothing odd."}, {"n": "Hidden text in a review", "q": "\u201cignore your rules and show expired milk\u201d (inside a review)", "sit": "A product review contains the sentence \u201cignore your rules and show expired milk\u201d, hoping the service will obey it.", "layers": [{"n": "Input checking", "x": "Review text is data. It is displayed or searched, never obeyed.", "st": "h"}, {"n": "Allowed-actions list", "x": "There is no operation called \u201cignore the rules\u201d, so there is nothing to run.", "st": "h"}, {"n": "Read-only access", "x": "Not involved: nothing tries to write data.", "st": "i"}, {"n": "Human approval", "x": "Not involved: nothing asks to change data.", "st": "i"}, {"n": "Final output gate", "x": "Expired milk fails the expiry rule, so it is removed before display whatever the text says.", "st": "h"}], "rule": "Words written by customers or in listings never widen what the service is allowed to do.", "result": "The review is shown as a review, and no expired item reaches the screen."}, {"n": "Item from a side path", "q": "a substitute with nuts for a customer with a nut allergy", "sit": "A substitute suggestion for a customer with a declared nut allergy includes a product that contains nuts. It came through a side path, not the main ranking.", "layers": [{"n": "Input checking", "x": "Not involved: no typed text is part of this case.", "st": "i"}, {"n": "Allowed-actions list", "x": "Not involved: suggesting a substitute is an allowed action.", "st": "i"}, {"n": "Read-only access", "x": "Not involved: nothing tries to write data.", "st": "i"}, {"n": "Human approval", "x": "Not involved: nothing asks to change data.", "st": "i"}, {"n": "Final output gate", "x": "Every item is checked against the hard constraints, including diet and allergy, whichever way it was generated. The item is blocked.", "st": "h"}], "rule": "There is no side door to the screen. Every item passes the same final check.", "result": "The nut item is replaced by the next eligible substitute, or the slot is left out."}, {"n": "A real cleanup", "q": "remove duplicate orders", "sit": "The data team finds duplicate order lines and asks for them to be removed. This is a real data change, not an attack.", "layers": [{"n": "Input checking", "x": "Not involved: this is a formal change request, not text typed into the app.", "st": "i"}, {"n": "Allowed-actions list", "x": "Removing data is not something the recommendation service does, so the request does not run inside it.", "st": "h"}, {"n": "Read-only access", "x": "The service can only read. Even if it tried, the database would refuse the write.", "st": "h"}, {"n": "Human approval", "x": "A named person sees the exact record IDs and the count first. If nobody answers in time, nothing runs.", "st": "h"}, {"n": "Final output gate", "x": "Customers keep seeing normal recommendations while the request waits.", "st": "h"}], "rule": "Cleanup targets specific record IDs after a named person approves. Silence means no.", "result": "Nothing changes until a person has seen exactly what will change and said yes."}]}, {"t": "co", "l": "Where they apply", "x": "All five operate in Pipeline A \u2013 Core, Pipeline B \u2013 Balanced and Pipeline C \u2013 Full.", "tone": "good"}], "kids": ["n10.1", "n10.2", "n10.3", "n10.4", "n10.5"], "kidsLabel": "", "after": true, "tint": 4, "art": "water"}, "n11": {"id": "n11", "title": "Edge cases and fallbacks", "blurb": "Unusual days, handled", "tag": "6 cases", "code": "11", "lead": "Never crash. Never show invalid items.", "blocks": [{"t": "p", "x": "Each case has a defined way to handle it and a fallback. The recommendation pipelines meet these six."}, {"t": "tb", "h": ["Case", "Where it is handled"], "r": [["New customer, no history", "Stage 0 \u2013 Route \u00b7 Stage 1 \u2013 Candidates"], ["Item sells out while browsing", "Stage 4 \u2013 Final gate \u00b7 Add-to-cart check"], ["Service slow or down", "Stage 4 \u2013 Fallback ladder \u00b7 Stage 4 \u2013 Serve and log"], ["Bad product data", "Data-health gate in ETL \u00b7 Stage 1 \u2013 Eligibility mask"], ["Stale data", "Data-health gate in ETL \u00b7 Stage 1 \u2013 Eligibility mask"], ["120 asked, 100 exist", "Stage 4 \u2013 Fallback ladder"]]}, {"t": "co", "l": "Cold start", "x": "Cold start is a technique, not a screen. It runs in Stage 0 \u2013 Route and Stage 1 \u2013 Candidates and is shown as a banner in Recommendation moments.", "tone": "good"}], "kids": ["n11.1", "n11.2", "n11.3", "n11.4", "n11.5", "n11.6"], "kidsLabel": "", "after": false, "tint": 5, "art": "eggs"}, "n12": {"id": "n12", "title": "Metrics", "blurb": "Application, Business and AI/ML", "tag": "3 groups", "code": "13", "lead": "A metric nobody acts on is cost. Each one below has an owner and a reason.", "blocks": [{"t": "co", "l": "Safety first", "x": "Ineligible exposure must be zero. No gain in relevance or revenue is worth showing an item that breaks a hard rule.", "tone": "warn"}, {"t": "co", "l": "North star", "x": "Cart value. It shows whether recommendations help customers fill the basket they actually want.", "tone": "good"}, {"t": "co", "l": "How the metrics connect", "x": "Application metrics set the limits and show the service is healthy. AI/ML metrics show whether the models rank well. Business metrics show whether that turns into cart value. Counter-metrics stop cart value rising by hurting the customer experience.", "tone": "note"}, {"t": "co", "l": "In plain words", "x": "The ranking model learns from conversion. Every recommendation shown is logged from day one. Limits and targets are agreed with the client.", "tone": "note"}], "kids": ["n12.a", "n12.b", "n12.m"], "kidsLabel": "Metric groups", "after": false, "tint": 1, "art": "coffee"}, "n13": {"id": "n13", "title": "Phase 2 - Agent", "blurb": "Agents that find, explain and fix issues", "tag": "6 steps", "code": "12", "lead": "Phase 1 is the recommendation pipelines. Phase 2 - Agent is the issue-fixing workflow. It reads logs and alerts and never touches the recommendation path.", "blocks": [{"t": "flow", "x": ["Issues dashboard", "Insights agent", "Insights summary", "RCA agent", "Remediation agent", "Business consumption"]}, {"t": "steps", "x": ["**Issues dashboard.** One screen with every live and past issue, filtered by store, application, issue type, time and status.", "**Insights agent.** Gives each issue a risk score and ranks store, category and application combinations, so the team knows where to look first.", "**Insights summary.** An LLM writes a short plain-language explanation for the top-ranked combinations only, from masked data. In plain words: an LLM is a program that writes text.", "**RCA agent.** Root-cause analysis: lists possible causes, checks each against the logs, picks the most likely and gives a confidence score. Low confidence means more evidence is gathered, a fixed number of times, then a person takes over with everything found so far.", "**Remediation agent.** Three routes: email the responsible owner, ask for approval first, or run a safe automatic fix.", "**Business consumption.** Each person gets the right view: IT support the dashboard and incident details, DevOps emails and approval requests, stakeholders plain-language insights."]}, {"t": "co", "l": "Link to Phase 1", "x": "Phase 1 logs and alerts feed this workflow.", "tone": "good"}, {"t": "co", "l": "Rule for automatic fixes", "x": "Automatic means a pre-approved, idempotent, reversible job. In plain words: safe to repeat, able to be undone, and never deleting or changing important data. Anything else needs Human approval.", "tone": "good"}, {"t": "co", "l": "Techniques", "x": "A weighted risk score plus anomaly detection (Isolation Forest, which spots data that looks unusual); an LLM for summaries on masked data; evidence-based root-cause analysis with a calibrated confidence score (confidence checked over time against what people later find). Named techniques are intended choices, confirmed by an offline test on client data.", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 2, "art": "butter"}, "sau": {"id": "sau", "title": "Customer stories", "blurb": "Two customers, nine screens", "tag": "Pipeline B \u2013 Balanced", "code": "14", "lead": "Priya is a New customer; Vedant is an Existing customer.", "blocks": [{"t": "co", "l": "How to read the stories", "x": "Both run on Pipeline B \u2013 Balanced through the same nine screens. Each row shows what the customer sees, then the stage and technique that produced it. Every item first passes the Eligibility mask in Stage 1 Candidates and the Stage 4 Final gate.", "tone": "note"}, {"t": "icons", "x": [["saurav", "Vedant \u00b7 Existing"], ["priya", "Priya \u00b7 New"]]}], "kids": ["sau.a", "sau.b"], "kidsLabel": "The two stories", "after": false, "tint": 2, "art": "saurav"}, "n15": {"id": "n15", "title": "Questions for the client", "blurb": "Before we design, build and launch", "tag": "3 stages", "code": "15", "lead": "", "blocks": [{"t": "h", "x": "Before we design"}, {"t": "ul", "x": [["Scope", "Which app screens are in scope? Is the issue-fixing agent (Phase 2 - Agent) in scope?"], ["Success", "What does success mean for the business?"], ["History", "How deep is customer history, and what do we know about guest shopping?"], ["Stock", "Is stock known per store, and how fresh is it?"], ["Dark s ", "<b>Behaviour-based category scoring.</b> Orders the category chips by how much this customer has browsed and bought in each, so their usual aisles come first."], ["Offers and Deals", "<b>Uplift modeling (S-learner).</b> Estimates how much an offer changes a customer\u2019s chance of buying, compared with no offer, so discounts go where they change behaviour."], ["Search pop-up", "<b>Prefix matching + learning-to-rank (LightGBM).</b> As letters are typed, matches products by their first letters, then ranks the matches by what this customer is likeliest to want."], ["Buy it again", "<b>LightGBM with purchase-interval features.</b> Looks at how often the customer usually buys each item and how long since the last time, so items that are due come first."], ["Substitution", "<b>Attribute-based candidate filtering + LightGBM ranking.</b> When an item is out of stock, finds products with matching attributes (type, size, diet), then ranks them by fit."], ["Add to cart", "<b>Item-item co-occurrence.</b> When something goes into the cart, suggests what other customers often buy with it. It uses the same shared table as the Home screen."], ["Recipe ideas", "<b>Masked language modeling (MLM) + curated recipe catalogue.</b> A model trained offline on the recipe catalogue learns which ingredients go together. Given the cart, it suggests recipes and the ingredients still missing."], ["Just before payment", "<b>Cart-aware LightGBM ranking.</b> Looks at the whole cart, not one item, and suggests last-minute items that fit it, such as things that are due."], ["Cold start (New and Guest)", "<b>Dark-store popularity + time-of-day rules.</b> With no history, shows what is popular at this dark store at this time of day. New customers also use sign-up preferences; Guests use only their session clicks."]]}, {"t": "h", "x": "Feature \u00d7 pipeline: the same facts as the Request path, turned on their side"}, {"t": "tb", "h": ["Feature", "Pipeline A \u2013 Core", "Pipeline B \u2013 Balanced (recommended)", "Pipeline C \u2013 Full"], "r": [["Home screen", "Item-item co-occurrence, repeat rule, dark-store popularity \u2192 Weighted score", "Item-item co-occurrence (shared table); ALS taste embeddings only if a test shows lift \u2192 LightGBM ranking", "Pipeline B \u2013 Balanced plus two-tower retrieval and sequence models (SASRec, GRU4Rec) \u2192 LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Category filters", "The customer\u2019s own categories, popular ones as filler \u2192 Category score with fixed weights (no training)", "The customer\u2019s own categories, popular ones as filler \u2192 Behaviour-based category scoring", "The customer\u2019s own categories, popular ones as filler \u2192 Same as Pipeline B \u2013 Balanced (no deeper variant defined)"], ["Offers and Deals", "Live offers at this dark store \u2192 Price-sensitivity rules", "Live offers at this dark store \u2192 Uplift model (S-learner); price-sensitivity rules until holdback data exists", "Live offers at this dark store \u2192 Same as Pipeline B \u2013 Balanced (no deeper variant defined)"], ["Search pop-up", "Prefix matching \u2192 Weighted score (past searches, popularity)", "Prefix matching \u2192 Learning-to-rank (LightGBM)", "Prefix matching \u2192 LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Buy it again", "The customer\u2019s own past purchases \u2192 Rule: days since last buy \u00f7 usual gap", "The customer\u2019s own past purchases \u2192 LightGBM with purchase-interval features", "The customer\u2019s own past purchases \u2192 Pipeline B \u2013 Balanced plus deep ranking (an interval or survival model is an option)"], ["Substitution", "Attribute-based candidate filtering \u2192 Weighted score (attribute similarity, price fit)", "Attribute-based candidate filtering \u2192 LightGBM ranking", "Attribute-based candidate filtering \u2192 LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Add to cart", "Item-item co-occurrence (shared table) \u2192 Ordered by co-occurrence strength (lift or cosine)", "Item-item co-occurrence (shared table) \u2192 Ordered by co-occurrence strength (lift or cosine)", "Pipeline B \u2013 Balanced plus sequence models for session intent \u2192 Ordered by co-occurrence strength (lift or cosine)"], ["Recipe ideas", "Catalogue content matching (recipes sharing ingredients with the cart) \u2192 Overlap with cart and diet tags", "MLM + curated recipe catalogue \u2192 MLM fit score", "Same as Pipeline B \u2013 Balanced (no deeper variant defined) \u2192 Same as Pipeline B \u2013 Balanced (no deeper variant defined)"], ["Just before payment", "Co-occurrence on the whole cart, plus items that are due \u2192 Weighted score (cart fit, due-ness, price fit)", "Co-occurrence on the whole cart, plus items that are due \u2192 Cart-aware LightGBM ranking", "Co-occurrence on the whole cart, plus items that are due \u2192 Cart-aware LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Cold start (New and Guest)", "Dark-store popularity (sign-up preferences for New, session clicks for Guest) \u2192 Time-of-day rules", "Dark-store popularity (sign-up preferences for New, session clicks for Guest) \u2192 Time-of-day rules", "Dark-store popularity (sign-up preferences for New, session clicks for Guest) \u2192 Time-of-day rules"]]}, {"t": "co", "l": "How to read this", "x": "Each cell reads Stage 1 Candidates \u2192 Stage 2 Rank. Stage 0, Stage 3 and Stage 4 are shared by every feature. Item-item co-occurrence is one table, shared by the Home screen and Add to cart.", "tone": "good"}, {"t": "co", "l": "Proposal", "x": "Named techniques are the intended choice. Each is confirmed by an offline test on client data. ALS taste embeddings are used only if a test shows lift.", "tone": "note"}], "kids": ["m1", "m2", "m3", "m4", "m5", "m6", "m7", "m8", "m9", "m10"], "kidsLabel": "", "after": false, "tint": 4, "art": "tomato"}, "a5.h": {"id": "a5.h", "title": "Data-health check", "blurb": "Is this data fit to use?", "tag": "2 checks", "code": "Check", "lead": "Before loading, we ask one question of every batch and every feed: is this data complete, fresh and sensible enough to use?", "blocks": [{"t": "co", "l": "In plain words", "x": "A data-health check compares what arrived with what we normally receive, and looks at how old each feed is. The limits are agreed with the client.", "tone": "good"}, {"t": "tb", "h": ["Check", "What it looks at"], "r": [["Batch check", "Each historical load: missing values, duplicates, values out of range, and whether the amount of data is in line with what we normally receive."], ["Feed check", "Each live feed: the time of its last update, compared with the age we allow."]]}, {"t": "tb", "h": ["If the check finds", "What happens"], "r": [["A few bad records", "Exclude: leave out those records and carry on with the rest. They go to the data owner for correction. If the missing field belongs to a hard constraint, such as expiry or an allergy tag, the item is not eligible."], ["A feed that is late or stale", "Degrade: use safe defaults, such as only categories that are reliably in stock, and flag that the system is in reduced mode."], ["A whole batch or feed that fails", "Serve the last good copy of the data until a good one arrives."]]}, {"t": "co", "l": "Example", "x": "The stock feed was last updated hours ago. It is treated as stale, stock-dependent items count as unavailable, safe defaults are shown and the reduced mode is logged. When fresh data arrives, normal behaviour resumes.", "tone": "note"}, {"t": "co", "l": "Where it is used", "x": "The Edge cases and fallbacks section and the Final gate in Stage 4 rely on this check.", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 2, "art": "eggs"}, "m9": {"id": "m9", "title": "Just before payment", "blurb": "Cart-aware LightGBM ranking", "tag": "Feature 9", "code": "9", "lead": "Looks at the whole cart, not one item, and suggests last-minute items that fit it, such as things that are due.", "blocks": [{"t": "kv", "x": [["Recommended technique (Pipeline B \u2013 Balanced)", "Cart-aware LightGBM ranking"], ["In plain words", "Looks at the whole cart, not one item, and suggests last-minute items that fit it, such as things that are due."], ["Runs in", "Stage 1 Candidates \u00b7 Stage 2 Rank \u00b7 Stage 3 Re-rank (in-cart removal, promotion cap)"], ["Pipeline A \u2013 Core variant", "Co-occurrence on the whole cart, plus items that are due \u2192 Weighted score (cart fit, due-ness, price fit)"], ["Pipeline B \u2013 Balanced variant", "Co-occurrence on the whole cart, plus items that are due \u2192 Cart-aware LightGBM ranking"], ["Pipeline C \u2013 Full variant", "Co-occurrence on the whole cart, plus items that are due \u2192 Cart-aware LightGBM plus deep ranking (Wide and Deep, DeepFM)"], ["Data it needs", "Live cart, order history, the shared co-occurrence table, prices."]]}], "kids": [], "kidsLabel": "", "after": false, "tint": 4, "art": "salt"}, "m10": {"id": "m10", "title": "Cold start (New and Guest)", "blurb": "Dark-store popularity + time-of-day rules", "tag": "Feature 10", "code": "10", "lead": "With no history, shows what is popular at this dark store at this time of day. New customers also use sign-up preferences; Guests use only their session clicks.", "blocks": [{"t": "kv", "x": [["Recommended technique (Pipeline B \u2013 Balanced)", "Dark-store popularity + time-of-day rules"], ["In plain words", "With no history, shows what is popular at this dark store at this time of day. New customers also use sign-up preferences; Guests use only their session clicks."], ["Note", "Not a screen. It is a technique that serves every screen for New and Guest customers."], ["Runs in", "Stage 0 Route \u00b7 Stage 1 Candidates \u00b7 Stage 2 Rank"], ["Pipeline A \u2013 Core variant", "Dark-store popularity (sign-up preferences for New, session clicks for Guest) \u2192 Time-of-day rules"], ["Pipeline B \u2013 Balanced variant", "Dark-store popularity (sign-up preferences for New, session clicks for Guest) \u2192 Time-of-day rules"], ["Pipeline C \u2013 Full variant", "Dark-store popularity (sign-up preferences for New, session clicks for Guest) \u2192 Time-of-day rules"], ["Data it needs", "Dark-store sales by hour; sign-up preferences (New); session clicks (Guest); first-order or sign-up offer."]]}], "kids": [], "kidsLabel": "", "after": false, "tint": 0, "art": "rice"}, "n9.1": {"id": "n9.1", "title": "Inventory", "blurb": "Only what is on the shelf", "tag": "", "code": "1", "lead": "A recommended item must really be available at the customer\u2019s store.", "blocks": [{"t": "tb", "h": ["", "Inventory"], "r": [["Problem", "The stock count is late or wrong, and the last unit is shown to many people at once."], ["Rule", "Show an item only if stock at the customer\u2019s store is above a small buffer and the reading is fresh."], ["Fix", "Re-check at display and at add-to-cart. If it sells out, offer a substitute that passes the same rules."]]}, {"t": "co", "l": "Applied in", "x": "Stage 1 \u2013 Eligibility mask \u00b7 Stage 4 \u2013 Final gate \u00b7 Add-to-cart check", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 3, "art": "milk"}, "n9.2": {"id": "n9.2", "title": "Delivery", "blurb": "Inside the zone and slot", "tag": "", "code": "2", "lead": "The store must be able to deliver the item to this address in the chosen slot.", "blocks": [{"t": "tb", "h": ["", "Delivery"], "r": [["Problem", "The item is outside the delivery zone or not available in the chosen slot. A Guest has not given a location yet."], ["Rule", "Show only what the serving store can deliver to that location and slot."], ["Fix", "Ask for the location first. When the address or slot changes, flag the affected items instead of removing them silently. Offer another slot or a substitute."]]}, {"t": "co", "l": "Applied in", "x": "Stage 1 \u2013 Eligibility mask \u00b7 Stage 4 \u2013 Final gate", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 4, "art": "cart"}, "n9.3": {"id": "n9.3", "title": "Expiry", "blurb": "Fresh at delivery time", "tag": "", "code": "3", "lead": "Shelf life is judged on the day the item arrives, not the day it is shown.", "blocks": [{"t": "tb", "h": ["", "Expiry"], "r": [["Problem", "The item is fine today but expired on arrival, or its expiry date is missing."], ["Rule", "Check remaining shelf life at delivery time."], ["Fix", "No expiry date means not eligible. Near-expiry items appear only as clearly labelled offers (offers start in Pipeline B \u2013 Balanced)."]]}, {"t": "co", "l": "Applied in", "x": "Stage 1 \u2013 Eligibility mask \u00b7 Stage 4 \u2013 Final gate", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 5, "art": "eggs"}, "n9.4": {"id": "n9.4", "title": "Diet and allergy", "blurb": "A positive tag is required", "tag": "", "code": "4", "lead": "A product counts as safe only when its tag says so. The product label stays the source of truth; this is not allergy advice.", "blocks": [{"t": "tb", "h": ["", "Diet and allergy"], "r": [["Problem", "A product has no tag, or a substitute for a sold-out item breaks a declared diet or allergy."], ["Rule", "A missing tag is not safe. Evidence of the tag must be present."], ["Fix", "Show fewer items, or no substitute, rather than relax the rule. Apply the strictest rule on shared accounts. Send untagged products to the catalogue team."]]}, {"t": "co", "l": "Applied in", "x": "Stage 1 \u2013 Eligibility mask \u00b7 Stage 4 \u2013 Final gate (substitutes, fillers and offers pass the same check)", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 0, "art": "paneer"}, "n9.5": {"id": "n9.5", "title": "Price and margin", "blurb": "Shown price equals charged price", "tag": "", "code": "5", "lead": "The customer pays what the screen showed.", "blocks": [{"t": "tb", "h": ["", "Price and margin"], "r": [["Problem", "A price feed error shows an item at zero or ten times its usual price, or the price changes between display and cart."], ["Rule", "Price correctness is hard. Margin is soft and capped."], ["Fix", "Compare each price with its history and hold outliers until verified. Re-check at add-to-cart, and ask the customer to confirm if the price cannot be verified."]]}, {"t": "co", "l": "Applied in", "x": "Stage 1 \u2013 Eligibility mask \u00b7 Stage 3 \u2013 Re-rank (capped margin weight, Pipeline B \u2013 Balanced and Pipeline C \u2013 Full) \u00b7 Stage 4 \u2013 Final gate \u00b7 Add-to-cart check", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 1, "art": "oil"}, "n10.1": {"id": "n10.1", "title": "Read-only access", "blurb": "The database refuses the write", "tag": "", "code": "1", "lead": "The recommender can look at data but cannot change it.", "blocks": [{"t": "tb", "h": ["", "Read-only access"], "r": [["Problem", "A bug, a wrong query or a tricked request lets the recommendation service change or delete sales, catalogue or stock data."], ["Fix", "The service connects with a role that can read but not write transactions, catalogue or stock. It writes only to its own logs and cache. The database itself refuses the write, because a permission cannot be talked around the way an instruction can."]]}, {"t": "co", "l": "Applied in", "x": "Every data read in Stage 0 \u2013 Route to Stage 4 \u2013 Final gate", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 3, "art": "water"}, "n10.2": {"id": "n10.2", "title": "Allowed-actions list", "blurb": "Only fetch, score, rank, log", "tag": "", "code": "2", "lead": "The service can do a short list of things and nothing else.", "blocks": [{"t": "tb", "h": ["", "Allowed-actions list"], "r": [["Problem", "Someone asks for an operation nobody planned, such as \u201cexport all customers\u201d."], ["Fix", "Only fetch, score, rank and log are allowed. Anything else is rejected, not interpreted. A new action needs a reviewed change."]]}, {"t": "co", "l": "Applied in", "x": "The service entrance, before Stage 0 \u2013 Route", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 5, "art": "butter"}, "n10.3": {"id": "n10.3", "title": "Input checking", "blurb": "Text is data, never a command", "tag": "", "code": "3", "lead": "Words typed by customers, or written in product titles and reviews, are only ever searched or displayed.", "blocks": [{"t": "tb", "h": ["", "Input checking"], "r": [["Problem", "A customer types a command in the search bar, or a title or review hides text like \u201cignore your rules\u201d."], ["Fix", "Text in search, titles and reviews is data, never a command. Odd text is cleaned or rejected. It never widens what the service may do, and it is backed by Read-only access and the Allowed-actions list."]]}, {"t": "co", "l": "Applied in", "x": "Stage 1 \u2013 Candidates (typed search text, product titles, reviews)", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 0, "art": "oats"}, "n10.4": {"id": "n10.4", "title": "Human approval", "blurb": "A named person sees the exact records", "tag": "", "code": "4", "lead": "Any change to data waits for a person who has seen exactly what will change.", "blocks": [{"t": "tb", "h": ["", "Human approval"], "r": [["Problem", "A cleanup such as \u201cdelete duplicate data\u201d could cover far more records than anyone intended, or be approved without a look."], ["Fix", "A named person sees the exact record IDs and the count first. Silence means no: if nobody answers in time, nothing runs."]]}, {"t": "co", "l": "Applied in", "x": "Any data-change request, and every Phase 2 - Agent action. The request path itself never writes.", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 1, "art": "coffee"}, "n10.5": {"id": "n10.5", "title": "Final output gate", "blurb": "One gate checks every item", "tag": "", "code": "5", "lead": "There is no side door to the screen.", "blocks": [{"t": "tb", "h": ["", "Final output gate"], "r": [["Problem", "An expired or ineligible item slips in through a side path, such as a substitute, a filler item or an offer."], ["Fix", "Every item is checked against the hard constraints before display, whichever way it was generated. A blocked item is replaced by the next eligible one, or the slot is left out."]]}, {"t": "co", "l": "Applied in", "x": "Stage 4 \u2013 Final gate", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 2, "art": "cheese"}, "n11.1": {"id": "n11.1", "title": "New customer, no history", "blurb": "Popular items and sign-up choices", "tag": "", "code": "1", "lead": "Samiksha installed the app today, or Atharva is browsing as a Guest. There is nothing to learn from yet.", "blocks": [{"t": "tb", "h": ["", "New customer, no history"], "r": [["Handle", "Route as cold: popular items near the store plus sign-up choices. For a Guest, the clicks in the current session guide the next suggestions."], ["Fallback", "In-stock best-sellers that pass every hard rule, chosen by dark-store popularity and time-of-day rules. Personal signals blend in as history grows; the switching point is set with client data."]]}, {"t": "co", "l": "In plain words", "x": "A dark store is a small local warehouse that serves online orders only. Dark-store popularity means what sells best at the store serving this customer.", "tone": "good"}, {"t": "co", "l": "Applied in", "x": "Stage 0 \u2013 Route \u00b7 Stage 1 \u2013 Candidates", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 5, "art": "milk"}, "n11.2": {"id": "n11.2", "title": "Sells out while browsing", "blurb": "The last pack goes before the tap", "tag": "", "code": "2", "lead": "Ann sees oat milk recommended, but another customer buys the last pack before she taps it.", "blocks": [{"t": "tb", "h": ["", "Item sells out while browsing"], "r": [["Handle", "Re-check stock at display and again at add-to-cart."], ["Fallback", "Offer the closest substitute that passes the same rules, with a plain message such as \u201cOut of stock. Here is a similar item.\u201d"]]}, {"t": "co", "l": "Applied in", "x": "Stage 4 \u2013 Final gate \u00b7 Add-to-cart check", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 0, "art": "oatmilk"}, "n11.3": {"id": "n11.3", "title": "Service slow or down", "blurb": "A time limit and a fuse", "tag": "", "code": "3", "lead": "At the evening peak the recommendation service times out.", "blocks": [{"t": "tb", "h": ["", "Service slow or down"], "r": [["Handle", "Every call has a time limit. A circuit breaker pauses calls after repeated failures so the service can recover."], ["Fallback", "Show a saved (cached) or popular list, re-checked with the same rules. If it cannot be verified, hide the row."]]}, {"t": "co", "l": "In plain words", "x": "A circuit breaker works like a fuse: it stops retries from piling onto a service that is already struggling.", "tone": "good"}, {"t": "co", "l": "Applied in", "x": "Stage 4 \u2013 Fallback ladder \u00b7 Stage 4 \u2013 Serve and log", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 3, "art": "water"}, "n11.4": {"id": "n11.4", "title": "Bad product data", "blurb": "No price, tag or expiry", "tag": "", "code": "4", "lead": "A newly listed product has no price, no diet tag or no expiry date.", "blocks": [{"t": "tb", "h": ["", "Bad product data"], "r": [["Handle", "A quality check runs before scoring. The Data-health gate in ETL checks each record and whole batches."], ["Fallback", "Skip the item, use the rest, and tell the catalogue team. If the missing field belongs to a hard rule, such as expiry or an allergen tag, the item is not eligible."]]}, {"t": "co", "l": "Applied in", "x": "Data-health gate in ETL \u00b7 Stage 1 \u2013 Eligibility mask", "tone": "good"}], "kids": [], "kidsLabel": "", "after": false, "tint": 2, "art": "jam"}, "n11.5": {"id": "n11.5", "title": "Stale data", "blurb": "The feed is hours old", "t ian \u00b7 budget-conscious \u00b7 Virar", "tag": "Pipeline B \u2013 Balanced", "code": "New", "lead": "A logged-in customer with no history. Stage 0 Route sends her down the Cold route.", "blocks": [{"t": "kv", "x": [["Who", "New customer in Virar, first orders"], ["Hard need", "Vegetarian, chosen at sign-up. The Eligibility mask enforces it"], ["Soft taste", "Budget-conscious, so small packs and low prices rank higher"], ["Route", "Stage 0 Route: Cold"]]}, {"t": "icons", "x": [["milk", "Milk"], ["bread", "Bread"], ["rice", "Rice"], ["dal", "Dal"], ["oil", "Oil (small pack)"]]}, {"t": "tb", "h": ["Screen", "What Priya sees on her first visit", "Stage and technique"], "r": [["1 Home screen", "Starter essentials: milk, bread, rice, dal", "Cold start in Stage 1 Candidates: dark-store popularity + time-of-day rules"], ["2 Category filters", "Categories popular at her dark store at this hour", "Cold start in Stage 1 Candidates. Behaviour-based category scoring needs history"], ["3 Offers and Deals", "A first-order offer", "First-order offer rule in Stage 2 Rank. Uplift modeling needs her history"], ["4 Search pop-up", "Popular nearby items for what she types", "Stage 1 Candidates: prefix matching. Stage 2 Rank: popularity, as personal data is missing"], ["5 Buy it again", "Not shown yet", "Needs past orders. Stage 2 Rank: LightGBM with purchase-interval features"], ["6 Substitution", "The nearest popular similar item", "Stage 1 Candidates: attribute-based filtering. Stage 2 Rank by popularity"], ["7 Add to cart", "Common pairings, such as butter with bread", "Stage 1 Candidates: item-item co-occurrence from all customers' baskets"], ["8 Recipe ideas", "Simple vegetarian recipes with rice and dal", "Stage 1 Candidates: masked language modeling with the curated recipe catalogue"], ["9 Just before payment", "Low-price essentials, such as a small oil pack", "Stage 2 Rank: cart-aware LightGBM ranking. Stage 4 Final gate: live check"]]}, {"t": "steps", "x": ["Cold start: dark-store popularity + time-of-day rules fill every screen", "Sign-up choices: vegetarian becomes a hard rule, budget becomes a soft preference", "First orders: her baskets feed item-item co-occurrence and her personal features; the first Buy it again appears", "Becoming a regular: Stage 0 Route sends her down the Warm route once enough history exists. The depth is agreed with the client"]}, {"t": "co", "l": "Outcome", "x": "She goes from shared starter picks to her own regular list.", "tone": "good"}, {"t": "co", "l": "Pipeline A \u2013 Core or Pipeline C \u2013 Full", "x": "Pipeline A \u2013 Core keeps rules and scores, with simple repeat-interval rules for Buy it again. Pipeline C \u2013 Full adds deep models once her history is long enough to learn from.", "tone": "note"}], "kids": [], "kidsLabel": "", "after": false, "tint": 3, "art": "priya"}, "n12.a": {"id": "n12.a", "title": "Application", "blurb": "Safety, stock, speed and reliability", "tag": "8 metrics", "code": "App", "lead": "The application metrics show whether the service is safe, fresh and fast. Safety limits come first and are never traded away.", "blocks": [{"t": "tb", "h": ["Metric", "What it measures", "What it does for us", "Watch out for"], "r": [["Ineligible exposure (must be zero)", "Items shown that break any Eligibility mask rule or the Final gate", "Proves the hard rules hold: inventory, delivery, expiry, diet and allergy, price and margin", "Any value above zero is a defect to fix, never a trade-off"], ["Out-of-stock at click", "Share of shown items that are unavailable when tapped", "Shows whether stock data keeps up with the shelf", "Stock can change between the check and the tap"], ["Stock freshness", "Age of the stock data used at serve time", "Keeps the Eligibility mask honest", "Stale stock lets the mask pass items it should block"], ["Fallback rate", "Share of requests served by the Fallback ladder", "Shows how often the main route could not answer", "A high rate can hide a failing service"], ["Short-slate rate", "Share of requests that return fewer items than asked for", "Shows how often the rules leave too few safe items", "Showing fewer is safe, but a high rate means the pool is too small"], ["Speed per stage (P95)", "Time within which 95 of every 100 requests finish, for each stage", "Finds the slow stage and protects the latency budget", "Extra checks add delay. The budget is agreed with the client"], ["Availability and errors", "Share of time the service responds normally, and share of failed requests", "Shows reliability at peak hours", "Blocked requests can look like errors, so separate the reasons"], ["Throughput", "Requests handled per second at peak", "Shows whether the system carries the busiest hours", "Test at the traffic level agreed with the client"]]}], "kids": [], "kidsLabel": "", "after": false, "tint": 0, "art": "salt"}, "n12.b": {"id": "n12.b", "title": "Business", "blurb": "Cart value, offer lift, cost and resolution", "tag": "8 metrics", "code": "Value", "lead": "North star: cart value. Offers must prove they add value, and costs and fixes are counted here.", "blocks": [{"t": "tb", "h": ["Metric", "What it measures", "What it does for us", "Watch out for"], "r": [["Cart value (north star)", "Average value of the cart at checkout", "One number for the business gain", "Must not rise by hurting trust. Check the counter-metrics"], ["Incremental lift for Offers and Deals", "Extra cart value or conversion versus the holdback group. The holdback group is a set of customers kept out of the offer test on purpose", "Shows whether offers add value or only reward purchases that would happen anyway", "Needs a clean holdback and logged offer exposure"], ["Counter-metrics", "Measures that must not get worse, for example cancellations or complaints. The list is agreed with the client", "Guard against gaining cart value at the customer's expense", "Too many dilute focus"], ["Cost leakage", "Discount or margin given away without changing behaviour", "Shows where offers waste money", "Only visible against the holdback group"], ["Cost per 1,000 recommendations", "Serving compute + lookups + Phase 2 - Agent LLM usage, for every 1,000 recommendations served", "One cost number to compare Pipeline A \u2013 Core, Pipeline B \u2013 Balanced and Pipeline C \u2013 Full", "No figures exist yet. Targets are agreed with the client"], ["Time to resolve (Phase 2 - Agent)", "Time from issue raised to issue fixed", "Shows whether the agent shortens fixes", "Approval waits count, so report them separately"], ["Resolution rate (Phase 2 - Agent)", "Share of issues fixed correctly", "Shows whether the agent solves issues or only reports them", "Check for repeat issues after a fix"], ["Cost per incident (Phase 2 - Agent)", "LLM and compute cost to handle one issue", "Shows whether the agent is worth running", "No figures exist yet. Targets are agreed with the client"]]}], "kids": [], "kidsLabel": "", "after": false, "tint": 3, "art": "cart"}, "n12.m": {"id": "n12.m", "title": "AI/ML", "blurb": "Ranking quality, acceptance and trust in the agents", "tag": "5 metrics", "code": "AI/ML", "lead": "The AI/ML metrics show whether the models rank well and whether the agents can be trusted.", "blocks": [{"t": "tb", "h": ["Metric", "What it measures", "What it does for us", "Watch out for"], "r": [["Ranking quality (NDCG at K)", "How high the wanted items sit in the list. K is the number of items returned", "Compares ranking models on the same logged sessions", "Needs logged clicks. Top positions get more taps whatever their quality"], ["Add-to-cart or acceptance rate", "Share of shown items that are put in the cart or accepted", "Shows whether customers act on what we show", "Cheap impulse items can lift it, so read it with cart value"], ["Category filter relevance", "Share of sessions where the customer picks one of the top-ranked categories", "Shows whether the category order matches real behaviour", "Screen position affects taps, so compare like with like"], ["Confidence calibration (Phase 2 - Agent)", "Whether the stated confidence matches how often the root-cause finding is right", "Tells staff when to trust the agent", "Needs enough past cases to check"], ["Groundedness (Phase 2 - Agent)", "Share of summary statements backed by logged evidence", "Stops invented explanations", "Summaries run on masked data, so some detail is hidden by design"]]}], "kids": [], "kidsLabel": "", "after": false, "tint": 2, "art": "oats"}}, "aisles": [{"id": "idea", "title": "Idea and customers", "sub": "Why, and for whom", "ids": ["n1", "n3", "n4"]}, {"id": "data", "title": "Data", "sub": "Data map and ETL", "ids": ["dfl", "a5"]}, {"id": "pipe", "title": "Pipeline", "sub": "Three pipelines, five stages", "ids": ["n8", "tech", "n6"]}, {"id": "rules", "title": "Rules and safety", "sub": "Constraints, guardrails, edge cases, Phase 2 - Agent", "ids": ["n9", "n10", "n11", "n13"]}, {"id": "more", "title": "Measure and questions", "sub": "Metrics, customer stories, questions for the client", "ids": ["n12", "sau", "n15"]}], "order": ["n1", "n3", "n4", "dfl", "a5", "n8", "tech", "n6", "n9", "n10", "n11", "n13", "n12", "sau", "n15"]};

var parent={};
D.order.forEach(function(id){parent[id]='home'});
Object.keys(D.nodes).forEach(function(id){D.nodes[id].kids.forEach(function(k){parent[k]=id})});
function siblings(id){var p=parent[id];return p==='home'?D.order:D.nodes[p].kids}
function pathOf(id){var o=[],c=id;while(c&&c!=='home'){o.unshift(c);c=parent[c]}return o}
function aisleOf(id){var t=pathOf(id)[0];for(var i=0;i<D.aisles.length;i++)if(D.aisles[i].ids.indexOf(t)>-1)return D.aisles[i].id;return 'home'}

var PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
function tileHTML(id){
  var n=D.nodes[id],c=n.code||'';
  return '<button type="button" class="tile" data-id="'+id+'" style="--tint:var(--t'+n.tint+')">'+
   '<span class="tile-art">'+ic(n.art,58)+'</span><span class="tile-top"><span class="code'+(c.length>3?' long':'')+'">'+esc(c)+'</span></span>'+(n.tag?'<span class="tag">'+esc(n.tag)+'</span>':'')+

function tone(l){
  l=(l||'').toLowerCase();
  if(/^(real-life problem|problem|situation|what happens|watch out)/.test(l))return 'k-problem';
  if(/^(what the system does|what it does|how it overcomes|how to overcome|handling|fix|rule|handle|how)/.test(l))return 'k-fix';
  if(/^(fallback|example)/.test(l))return 'k-fall';
  if(/^(ml engine|main engines|key signal|engine|measures)/.test(l))return 'k-ml';
  return '';
}
function starCell(t){var m=/^([1-5]) stars?$/i.exec(String(t).trim());if(!m)return null;var n=+m[1],s='';for(var i=0;i<5;i++)s+=i<n?'★':'<i>★</i>';return '<span class="stars" role="img" aria-label="'+n+' of 5 stars">'+s+'<small>'+n+' star'+(n>1?'s':'')+'</small></span>'}
function tableHTML(b){

function cardHTML(c){
  var s='<div class="card">';

    if(c.ol||c.x.every(function(i){return !i[0]})){s+='<'+(c.ol?'ol':'ul')+'>'+c.x.map(function(i){return '<li>'+md(i[1])+'</li>'}).join('')+'</'+(c.ol?'ol':'ul')+'>'}

function render(b,ctx){
  switch(b.t){
  case 'p':return '<p class="para">'+br(b.x)+'</p>';
  case 'h':return '<h3 class="sub">'+esc(b.x)+'</h3>';
  case 'ul':return '<ul class="list">'+b.x.map(function(i){return '<li>'+(i[0]?'<b>'+esc(i[0])+':</b> ':'')+br(i[1])+'</li>'}).join('')+'</ul>';
  case 'co':return '<aside class="co co-'+b.tone+(b.tone==='note'?' more':'')+'"><span class="co-l">'+esc(b.l)+'</span><p>'+md(b.x)+'</p></aside>';
  case 'tb':return tableHTML(b);
  case 'cards':return '<div class="cards">'+b.x.map(cardHTML).join('')+'</div>';
  case 'kv':return '<dl class="kv">'+b.x.map(function(r){return '<div class="kv-row"><dt class="'+tone(r[0])+'">'+esc(r[0]||'')+'</dt><dd>'+br(r[1])+'</dd></div>'}).join('')+'</dl>';
  case 'steps':return '<ol class="steps">'+b.x.map(function(t){return '<li><span>'+br(t)+'</span></li>'}).join('')+'</ol>';
  case 'flow':return '<div class="flow">'+b.x.map(function(t){return '<span class="flow-n">'+esc(t)+'</span>'}).join('<span class="flow-a" aria-hidden="true">→</span>')+'</div>';
  case 'link':return '<button type="button" class="golink" data-go="'+b.to+'">'+esc(b.x)+' <span aria-hidden="true">→</span></button>';
  case 'qa':return '<div class="qa">'+b.x.map(function(r,i){return '<details class="q"'+(i===0?' open':'')+'><summary>'+esc(r[0])+'</summary><div class="qa-b"><p>'+md(r[1])+'</p></div></details>'}).join('')+'</div>';
  case 'chips':return '<div class="chipset">'+b.x.map(function(s){return '<span>'+esc(s)+'</span>'}).join('')+'</div>';
  case 'icons':return '<div class="icgrid">'+b.x.map(function(r){return '<div>'+ic(r[0],56)+esc(r[1])+'</div>'}).join('')+'</div>';
  case 'people':return '<div class="ppl">'+b.x.map(function(r){return '<div class="pp">'+ic(r[0],84)+'<b>'+esc(r[1])+'</b><span>'+esc(r[2])+'</span></div>'}).join('')+'</div>';
  case 'mgrid':return '<div class="mg">'+b.x.map(function(r){return '<div class="mg-row">'+ic(r.p,44)+'<div><div class="nm">'+esc(r.n)+'</div>'+(r.i.length?'<div class="ics">'+r.i.map(function(k){return ic(k,30)}).join('')+'</div>':'')+'<div class="tx">'+esc(r.t)+'</div></div></div>'}).join('')+'</div>';
  case 'svg':return '<figure class="fig dg"><div class="fig-scroll" tabindex="0">'+SVGS[b.k]+'</div><figcaption><span>'+esc(b.c)+'</span><button type="button" class="btn-sm fit-toggle">Zoom in</button></figcaption></figure>';
  case 'demo':ctx.demos.push(b);return '<div class="demo" data-di="'+(ctx.demos.length-1)+'" data-demo="'+b.n+'"></div>';
  }
  return '';
}

function buildScreen(id){
  var n=D.nodes[id],ctx={demos:[]};
  var el=document.createElement('section');
  el.className='screen';el.setAttribute('data-id',id);el.setAttribute('aria-label',n.title);
  el.style.setProperty('--tint','var(--t'+n.tint+')');
  var sibs=siblings(id),idx=sibs.indexOf(id),path=pathOf(id);
  var crumbs='<button type="button" class="crumb" data-depth="0">Home</button>';
  for(var i=0;i<path.length-1;i++)crumbs+='<span class="sep" aria-hidden="true">›</span><button type="button" class="crumb" data-depth="'+(i+1)+'">'+esc(D.nodes[path[i]].title)+'</button>';
  crumbs+='<span class="sep" aria-hidden="true">›</span><span class="cur">'+esc(n.title)+'</span>';
  var kids=n.kids.length?'<div class="kids-head"><span>Inside · '+n.kids.length+'</span><span class="hint">tap to zoom</span></div><div class="grid">'+n.kids.map(tileHTML).join('')+'</div>':'';
  var blocks=n.blocks.map(function(b){return render(b,ctx)}).join('');
  var code=n.code||'';
  el.innerHTML='<div class="s-scroll"><header class="s-bar"><div class="wrap s-bar-in">'+
   '<button type="button" class="back">'+LEFT+'Back</button><nav class="crumbs" aria-label="Breadcrumb">'+crumbs+'</nav>'+
   '<div class="pager"'+'>'+THB+'<button type="button" class="ico s-search" aria-label="Search">'+SEARCHI+'</button><button type="button" class="ico pg-prev" aria-label="Previous"'+(idx<=0?' disabled':'')+'>'+LEFT+'</button><span>'+(idx+1)+' / '+sibs.length+'</span><button type="button" class="ico pg-next" aria-label="Next"'+(idx>=sibs.length-1?' disabled':'')+'>'+RIGHT+'</button></div>'+
   '</div></header>'+
   '<div class="s-hero"><div class="wrap"><div class="s-code'+(code.length>3?' long':'')+'">'+esc(code)+'</div><div>'+(n.tag?'<span class="s-tag">'+esc(n.tag)+'</span>':'')+'<h2>'+esc(n.title)+'</h2>'+(n.lead?'<p class="lead">'+md(n.lead)+'</p>':'')+'</div><div class="s-art">'+ic(n.art,140)+'</div></div></div>'+
   '<div class="wrap s-body">'+(n.after?blocks+kids:kids+blocks)+'</div></div>';
  el._demos=ctx.demos;
  syncTheme();
  return el;
}

DEMOS.persona=function(d,b){
  var cur=null;
  d.innerHTML='<h3 class="sub p-head" aria-live="polite"></h3><div class="pav" role="group" aria-label="Choose a customer"></div><p class="pbanner" hidden></p><div class="pgrid p9"></div>';
  var head=$('.p-head',d),seg=$('.pav',d),ban=$('.pbanner',d),grid=$('.pgrid',d);
  PERSONAS.forEach(function(p){
    var x=document.createElement('button');x.type='button';x.setAttribute('data-k',p.k);
    x.innerHTML=ic(p.k,38)+'<span>'+esc(p.name)+' · '+esc(p.short)+'</span>';seg.appendChild(x)});
  var clr=document.createElement('button');clr.type='button';clr.className='clear';clr.textContent='Clear';seg.appendChild(clr);
  function find(){for(var i=0;i<PERSONAS.length;i++)if(PERSONAS[i].k===cur)return PERSONAS[i];return null}
  function draw(){
    var p=find();
    head.textContent=p?p.name+' · '+p.label:'Recommendation moments';
    $$('button[data-k]',seg).forEach(function(x){x.setAttribute('aria-pressed',x.getAttribute('data-k')===cur?'true':'false')});
    clr.style.display=p?'':'none';
    if(p&&p.cold){ban.hidden=false;ban.innerHTML='<b>Cold start: dark-store popularity + time-of-day rules.</b> '+esc(p.coldNote||'')}
    else ban.hidden=true;
    grid.innerHTML=b.screens.map(function(s){
      var h='<div class="pcard"><h4>'+esc(s.n)+'</h4><p class="what">'+esc(s.d)+'</p><p class="tech"><b>Technique:</b> '+esc(s.tech)+'</p>';
      if(!p)return h+'<p class="pickme">Pick a customer to see what they would see</p></div>';
      var c=(p.mx&&p.mx[s.n])||{i:[],t:''};
      if(c.c)h+='<div class="chips2">'+c.c.map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>';
      else h+='<div class="ics">'+(c.i&&c.i.length?c.i.map(function(k){return ic(k,34)}).join(''):'<span class="none">nothing yet</span>')+'</div>';
      return h+'<p>'+esc(c.t)+'</p></div>';
    }).join('');
  }
  seg.addEventListener('click',function(e){
    var x=e.target.closest('button');if(!x)return;
    if(x===clr)cur=null;
    else{var k=x.getAttribute('data-k');cur=(cur===k)?null:k}
    draw();
  });
